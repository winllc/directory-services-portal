# Portal (web UI + API) and OpenLDAP for testing against a real directory.
#   docker compose up --build   ->  http://localhost:3001  (sign in as "admin" / "admin", or "alice" / "alice")
# The portal image bundles the React client, so the single "portal" service serves both the UI
# and /api. The in-memory demo needs no containers: `npm run dev`.
services:
  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: Example Corp
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: admin
    command: --copy-service
    volumes:
      - ./deploy/ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom
    ports:
      - "389:389"
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "dc=example,dc=com", "-s", "base", "-D", "cn=admin,dc=example,dc=com", "-w", "admin"]
      interval: 5s
      timeout: 5s
      retries: 20

  portal:
    build: .
    depends_on:
      openldap:
        condition: service_healthy
    environment:
      DIRECTORY_MODE: ldap
      LDAP_URL: ldap://openldap:389
      LDAP_BIND_DN: cn=admin,dc=example,dc=com
      LDAP_BIND_PASSWORD: admin
      LDAP_BASE_DN: dc=example,dc=com
      LDAP_USER_SEARCH_BASE: ou=people,dc=example,dc=com
      LDAP_GROUP_SEARCH_BASE: ou=groups,dc=example,dc=com
      ADMIN_USERS: admin
      ADMIN_GROUPS: cn=directory-admins,ou=groups,dc=example,dc=com
      COOKIE_SECURE: "false"
    ports:
      - "3001:3001"
    volumes:
      - portal-data:/data

volumes:
  portal-data:
