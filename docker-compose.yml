# Directory Services Portal: web client, API and an OpenLDAP loaded with the demo organisation.
#   docker compose up --build
#   Sign in as admin / password (administrator), or alice, bob, erin, dave, frank / password.
#
# No service publishes a port on the host. Reach the portal through a reverse proxy on this
# compose network (target web:80), or uncomment the ports entry of the web service
# (-> http://localhost:8181).
#
#   web       nginx serving the React client on port 80; proxies /api to the api service (one
#             origin for the browser, so session cookies and CSRF protection work unchanged)
#   api       Spring Boot REST API (not published on the host)
#   openldap  directory server (not published on the host)
#
# X.509 client-certificate sign-in: see docker-compose.mtls.yml.
# The in-memory demo needs no containers: `npm run dev`.
#
# The LDIF in deploy/openldap/ldif is only loaded into an empty directory. After changing it
# (or to start over), run `docker compose down -v` first.
services:
  openldap:
    # Built locally from deploy/openldap (Ubuntu's slapd), so it runs natively on amd64 and arm64.
    build: ./deploy/openldap
    environment:
      LDAP_SUFFIX: dc=example,dc=com
      # Password of the LDAP administrator (cn=admin,dc=example,dc=com) that the API binds as.
      # It is not a portal login; portal users are the uid=... entries in deploy/openldap/ldif.
      LDAP_ADMIN_PASSWORD: admin
    volumes:
      - ldap-data:/var/lib/ldap
    # Not published on the host (the API reaches it over the compose network). To inspect it
    # with ldapsearch from your machine, uncomment:
    # ports:
    #   - "1389:389"
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "uid=admin,ou=people,dc=example,dc=com", "-s", "base", "-D", "cn=admin,dc=example,dc=com", "-w", "admin"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build: ./backend
    depends_on:
      openldap:
        condition: service_healthy
    environment:
      DIRECTORY_MODE: ldap
      LDAP_URL: ldap://openldap:389
      LDAP_BIND_DN: cn=admin,dc=example,dc=com
      LDAP_BIND_PASSWORD: admin
      LDAP_BASE_DN: dc=example,dc=com
      LDAP_USER_SEARCH_BASE: dc=example,dc=com
      LDAP_GROUP_SEARCH_BASE: ou=groups,dc=example,dc=com
      ADMIN_USERS: admin
      ADMIN_GROUPS: cn=directory-admins,ou=groups,dc=example,dc=com
      # Example forms, directories and permissions matching the demo organisation.
      SEED_DEMO_CONFIG: "true"
      LOGIN_HINT: "Demo: sign in as admin (administrator), alice, bob, erin (HR), dave (helpdesk) or frank (partner). Password: password"
      COOKIE_SECURE: "false"
      # Honour X-Forwarded-* set by the web proxy (which overwrites them), so the API sees the real
      # client address (used for login throttling) and scheme. The api service is not published,
      # so only the proxy can reach it.
      FORWARD_HEADERS_STRATEGY: framework
    volumes:
      - portal-data:/data
    # To call the API directly from your machine, uncomment:
    # ports:
    #   - "3001:3001"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      - api
    environment:
      API_URL: http://api:3001
    # Not published on the host: attach your reverse proxy to this compose network and route to
    # web:80. To open it directly from your machine instead, uncomment:
    # ports:
    #   - "8181:80"
    expose:
      - "80"

volumes:
  portal-data:
  ldap-data:
