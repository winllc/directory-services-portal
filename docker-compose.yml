# Portal (web UI + API) and OpenLDAP loaded with the demo organisation.
#   docker compose up --build   ->  http://localhost:3001
#   Sign in as admin / password (administrator), or alice, bob, erin, dave, frank / password.
# The portal image bundles the React client, so the single "portal" service serves both the UI
# and /api. The in-memory demo needs no containers: `npm run dev`.
#
# The LDIF in deploy/openldap/ldif is only loaded into an empty directory. After changing it
# (or to start over), run `docker compose down -v` first.
services:
  openldap:
    # Built locally from deploy/openldap (Ubuntu's slapd), so it runs natively on amd64 and arm64.
    build: ./deploy/openldap
    environment:
      LDAP_SUFFIX: dc=example,dc=com
      # Password of the LDAP administrator (cn=admin,dc=example,dc=com) that the portal binds as.
      # It is not a portal login; portal users are the uid=... entries in deploy/openldap/ldif.
      LDAP_ADMIN_PASSWORD: admin
    volumes:
      - ldap-data:/var/lib/ldap
    # Not published on the host (the portal reaches it over the compose network). To inspect it
    # with ldapsearch from your machine, uncomment:
    # ports:
    #   - "1389:389"
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "uid=admin,ou=people,dc=example,dc=com", "-s", "base", "-D", "cn=admin,dc=example,dc=com", "-w", "admin"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  portal:
    build: .
    depends_on:
      openldap:
        condition: service_healthy
    environment:
      DIRECTORY_MODE: ldap
      LDAP_URL: ldap://openldap:389
      LDAP_BIND_DN: cn=admin,dc=example,dc=com
      LDAP_BIND_PASSWORD: admin
      LDAP_BASE_DN: dc=example,dc=com
      LDAP_USER_SEARCH_BASE: dc=example,dc=com
      LDAP_GROUP_SEARCH_BASE: ou=groups,dc=example,dc=com
      ADMIN_USERS: admin
      ADMIN_GROUPS: cn=directory-admins,ou=groups,dc=example,dc=com
      # Example forms, directories and permissions matching the demo organisation.
      SEED_DEMO_CONFIG: "true"
      LOGIN_HINT: "Demo: sign in as admin (administrator), alice, bob, erin (HR), dave (helpdesk) or frank (partner). Password: password"
      COOKIE_SECURE: "false"
    ports:
      - "3001:3001"
    volumes:
      - portal-data:/data

volumes:
  portal-data:
  ldap-data:
