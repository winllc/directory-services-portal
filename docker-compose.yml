# Directory Services Portal: web client, API and an OpenLDAP loaded with the demo organisation.
#   docker compose up --build
#   Sign in as admin / password (administrator), or alice, bob, erin, dave, frank / password.
#
# No service publishes a port on the host. Reach the portal through a reverse proxy on this
# compose network (target web:8080), or uncomment the ports entry of the web service
# (-> http://localhost:8181).
#
#   web       nginx serving the React client on port 8080; proxies /api to the api service (one
#             origin for the browser, so session cookies and CSRF protection work unchanged)
#   api       Spring Boot REST API (not published on the host)
#   openldap  directory server (not published on the host)
#
# The web and api images are based on Red Hat UBI 9 and run as unprivileged users.
#
# ENS license: without one the demo shows only the license screen. Download an evaluation license
# for the Directory Services Portal from the ENS licensing portal and either upload it on the
# license screen (sign in as admin), or save it as ./license/license.lic before `up`: the
# license-init service copies it into the ens-license volume when that has no license yet.
# The volume also keeps this installation's id; `docker compose down -v` deletes it.
#
# X.509 client-certificate sign-in: see docker-compose.mtls.yml.
# The in-memory demo needs no containers: `npm run dev`.
#
# The LDIF in deploy/openldap/ldif is only loaded into an empty directory. After changing it
# (or to start over), run `docker compose down -v` first.
services:
  openldap:
    # Built locally from deploy/openldap (Ubuntu's slapd), so it runs natively on amd64 and arm64.
    build: ./deploy/openldap
    environment:
      LDAP_SUFFIX: dc=example,dc=com
      # Password of the LDAP administrator (cn=admin,dc=example,dc=com) that the API binds as.
      # It is not a portal login; portal users are the uid=... entries in deploy/openldap/ldif.
      LDAP_ADMIN_PASSWORD: admin
    volumes:
      - ldap-data:/var/lib/ldap
    # Not published on the host (the API reaches it over the compose network). To inspect it
    # with ldapsearch from your machine, uncomment:
    # ports:
    #   - "1389:389"
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "uid=admin,ou=people,dc=example,dc=com", "-s", "base", "-D", "cn=admin,dc=example,dc=com", "-w", "admin"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Copies ./license/license.lic (if present) into the ens-license volume when it has no license
  # yet, then exits. A license uploaded on the license screen is never overwritten.
  license-init:
    build: ./backend
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -f /seed/license.lic ] && [ ! -f /var/lib/ens/directory-portal/license.lic ]; then
          cp /seed/license.lic /var/lib/ens/directory-portal/license.lic && echo "Installed ./license/license.lic" \
            || echo "Could not copy ./license/license.lic (is it readable? chmod 644); upload it on the license screen"
        fi
        exit 0
    volumes:
      - ./license:/seed:ro
      - ens-license:/var/lib/ens/directory-portal
    restart: "no"

  api:
    build: ./backend
    depends_on:
      openldap:
        condition: service_healthy
      license-init:
        condition: service_completed_successfully
    environment:
      DIRECTORY_MODE: ldap
      LDAP_URL: ldap://openldap:389
      LDAP_BIND_DN: cn=admin,dc=example,dc=com
      LDAP_BIND_PASSWORD: admin
      LDAP_BASE_DN: dc=example,dc=com
      LDAP_USER_SEARCH_BASE: dc=example,dc=com
      LDAP_GROUP_SEARCH_BASE: ou=groups,dc=example,dc=com
      ADMIN_USERS: admin
      ADMIN_GROUPS: cn=directory-admins,ou=groups,dc=example,dc=com
      # Example forms, directories and permissions matching the demo organisation.
      SEED_DEMO_CONFIG: "true"
      LOGIN_HINT: "Demo: sign in as admin (administrator), alice, bob, erin (HR), dave (helpdesk) or frank (partner). Password: password"
      # Optional fixed banner at the top and bottom of every page:
      # BANNER_TEXT: "UNCLASSIFIED"
      # BANNER_FOREGROUND: "#ffffff"
      # BANNER_BACKGROUND: "#007a33"
      COOKIE_SECURE: "false"
      # Honour X-Forwarded-* set by the web proxy (which overwrites them), so the API sees the real
      # client address (used for login throttling) and scheme. The api service is not published,
      # so only the proxy can reach it.
      FORWARD_HEADERS_STRATEGY: framework
      # Audit logging (README, Audit logging): passed through from your shell or a .env file.
      ENS_AUDIT_STDOUT: ${ENS_AUDIT_STDOUT:-true}
      ENS_AUDIT_FILE: ${ENS_AUDIT_FILE:-}
      ENS_AUDIT_FILE_KEEP: ${ENS_AUDIT_FILE_KEEP:-30}
      ENS_AUDIT_RETENTION_DAYS: ${ENS_AUDIT_RETENTION_DAYS:-0}
      ENS_AUDIT_SPLUNK_URL: ${ENS_AUDIT_SPLUNK_URL:-}
      ENS_AUDIT_SPLUNK_TOKEN: ${ENS_AUDIT_SPLUNK_TOKEN:-}
      ENS_AUDIT_SPLUNK_TOKEN_FILE: ${ENS_AUDIT_SPLUNK_TOKEN_FILE:-}
      ENS_AUDIT_SPLUNK_INDEX: ${ENS_AUDIT_SPLUNK_INDEX:-}
      ENS_AUDIT_SPLUNK_SOURCETYPE: ${ENS_AUDIT_SPLUNK_SOURCETYPE:-ens:audit}
      ENS_AUDIT_SPLUNK_INSECURE: ${ENS_AUDIT_SPLUNK_INSECURE:-false}
      ENS_AUDIT_SYSLOG_HOST: ${ENS_AUDIT_SYSLOG_HOST:-}
      ENS_AUDIT_SYSLOG_PORT: ${ENS_AUDIT_SYSLOG_PORT:-}
      ENS_AUDIT_SYSLOG_PROTOCOL: ${ENS_AUDIT_SYSLOG_PROTOCOL:-tcp}
      ENS_AUDIT_SYSLOG_FACILITY: ${ENS_AUDIT_SYSLOG_FACILITY:-local0}
    volumes:
      - portal-data:/data
      # ENS license (ENS_LICENSE_FILE / ENS_LICENSE_STATE_DIR, set by the image): the uploaded
      # license, the installation id and the license revisions seen. Writable; keep it.
      - ens-license:/var/lib/ens/directory-portal
      # The ENS_AUDIT_FILE output (e.g. /var/log/ens/directory-portal/audit.jsonl), for a log
      # forwarder to tail. The audit store itself is in portal-data (/data/audit).
      - ens-audit:/var/log/ens
    # To call the API directly from your machine, uncomment:
    # ports:
    #   - "3001:3001"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      - api
    environment:
      API_URL: http://api:3001
    # Not published on the host: attach your reverse proxy to this compose network and route to
    # web:8080. To open it directly from your machine instead, uncomment:
    # ports:
    #   - "8181:8080"
    expose:
      - "8080"

volumes:
  portal-data:
  ldap-data:
  ens-license:
  ens-audit:
