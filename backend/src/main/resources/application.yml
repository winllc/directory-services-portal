# Directory Services Portal. Every setting can be supplied through the environment
# variables shown in ${...} (see .env.example).
server:
  port: ${PORT:3001}
  servlet:
    session:
      # The default for sessions before sign-in; signed-in sessions get ens.session's idle timeout
      # (shorter for administrators with ENS_SESSION_ADMIN_IDLE_TIMEOUT).
      timeout: ${ENS_SESSION_IDLE_TIMEOUT:${SESSION_TTL_MINUTES:30}m}
      cookie:
        name: DSP_SESSION
        http-only: true
        same-site: strict
        # Secure on direct TLS anyway; ENS_COOKIE_SECURE=true when a proxy terminates TLS
        # (COOKIE_SECURE is the older name).
        secure: ${ENS_COOKIE_SECURE:${COOKIE_SECURE:false}}
  # SERVER_FORWARD_HEADERS_STRATEGY (Boot's own name) or FORWARD_HEADERS_STRATEGY: "framework"
  # behind the web tier or another proxy that overwrites X-Forwarded-*.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:${FORWARD_HEADERS_STRATEGY:none}}
  # Room for a forwarded client certificate plus large single-sign-on cookies (default 8KB).
  max-http-request-header-size: ${MAX_HTTP_REQUEST_HEADER_SIZE:32KB}

spring:
  application:
    name: directory-services-portal
  jackson:
    deserialization:
      fail-on-unknown-properties: false

# Health probes and metrics. On the main port: /actuator/health with its liveness and readiness
# groups (also /livez and /readyz), details for administrators only. MANAGEMENT_SERVER_PORT (Boot's
# own setting, unset by default) moves them to a separate port that also serves
# /actuator/prometheus, both without sign-in; never publish that port. Without it, Prometheus is
# not exposed at all (see ManagementEndpoints).
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        # What the API can't serve without: the directory, the audit log and its disk.
        readiness:
          include: readinessState,ldap,auditLog,diskSpace
  health:
    diskspace:
      path: ${portal.data-dir}

# Structured JSON logs: LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (Boot's own setting; the audit lines
# on the ens.audit logger stay raw ens-audit/1 JSON either way).

portal:
  directory-mode: ${DIRECTORY_MODE:memory}
  ldap:
    url: ${LDAP_URL:ldap://localhost:389}
    bind-dn: ${LDAP_BIND_DN:}
    bind-password: ${LDAP_BIND_PASSWORD:}
    # A file holding the password, read instead of LDAP_BIND_PASSWORD when set (preferred: the
    # environment can be read by anyone who can inspect the process or container).
    bind-password-file: ${LDAP_BIND_PASSWORD_FILE:}
    start-tls: ${LDAP_STARTTLS:false}
    tls-reject-unauthorized: ${LDAP_TLS_REJECT_UNAUTHORIZED:true}
    timeout-ms: ${LDAP_TIMEOUT_MS:10000}
    pool-size: ${LDAP_POOL_SIZE:10}
  base-dn: ${LDAP_BASE_DN:dc=example,dc=com}
  user-search-base: ${LDAP_USER_SEARCH_BASE:}
  user-filter: ${LDAP_USER_FILTER:(&(objectClass=inetOrgPerson)(uid={{username}}))}
  username-attribute: ${LDAP_USERNAME_ATTRIBUTE:uid}
  group-search-base: ${LDAP_GROUP_SEARCH_BASE:}
  group-filter: ${LDAP_GROUP_FILTER:(|(member={{dn}})(uniqueMember={{dn}}))}
  admin-users: ${ADMIN_USERS:}
  admin-groups: ${ADMIN_GROUPS:}
  data-dir: ${DATA_DIR:./data}
  seed-demo-config: ${SEED_DEMO_CONFIG:}
  password-login-enabled: ${PASSWORD_LOGIN_ENABLED:true}
  login-hint: ${LOGIN_HINT:}
  # Failed password sign-ins: after max-failures within lockout-window (from the first failure),
  # further attempts for that user name from that address are refused until the window ends.
  login:
    max-failures: ${LOGIN_MAX_FAILURES:8}
    lockout-window: ${LOGIN_LOCKOUT_WINDOW:15m}
  # How often a signed-in user's groups and administrator status are read again from the
  # directory (checked on request; 0 = only at sign-in).
  group-refresh-interval: ${GROUP_REFRESH_INTERVAL:5m}
  # The audit store: monthly ens-audit/1 JSONL files (default $DATA_DIR/audit). AUDIT_MEMORY_EVENTS
  # is accepted for compatibility but no longer used: searches read all retained history.
  audit:
    dir: ${AUDIT_DIR:}
    memory-events: ${AUDIT_MEMORY_EVENTS:10000}
  # Metrics dashboards and data analysis (comparisons, quality checks).
  metrics:
    max-entries: ${METRICS_MAX_ENTRIES:100000}
    cache-seconds: ${METRICS_CACHE_SECONDS:60}
    max-issues: ${ANALYSIS_MAX_ISSUES:50000}
    # Metrics that take longer than this continue in the background and notify when ready.
    wait-millis: ${METRICS_WAIT_MILLIS:2000}
  # Background computations: analyses always, metrics when they outlast wait-millis.
  jobs:
    metrics-threads: ${JOBS_METRICS_THREADS:4}
    analysis-threads: ${JOBS_ANALYSIS_THREADS:2}
    max-active-per-user: ${JOBS_MAX_ACTIVE_PER_USER:5}
    retain-minutes: ${JOBS_RETAIN_MINUTES:1440}
  # Optional fixed banner at the top and bottom of every page (off while the text is empty).
  banner:
    text: ${BANNER_TEXT:}
    foreground: "${BANNER_FOREGROUND:#ffffff}"
    background: "${BANNER_BACKGROUND:#007a33}"
  x509:
    enabled: ${X509_ENABLED:false}
    source: ${X509_SOURCE:servlet}
    header: ${X509_HEADER:X-SSL-Client-Cert}
    trusted-proxies: ${X509_TRUSTED_PROXIES:127.0.0.1/32;::1/128}
    # Header mode: the secret the web tier sends in X-DSP-Proxy-Secret (prefer the _FILE form).
    proxy-secret: ${X509_PROXY_SECRET:}
    proxy-secret-file: ${X509_PROXY_SECRET_FILE:}
    trusted-ca-file: ${X509_TRUSTED_CA_FILE:}
    check-revocation: ${X509_CHECK_REVOCATION:false}
    mapping: ${X509_MAPPING:filter}
    user-filter: ${X509_USER_FILTER:(&(objectClass=inetOrgPerson)(uid={{cn}}))}
    require-certificate-match: ${X509_REQUIRE_CERTIFICATE_MATCH:false}
    auto-login: ${X509_AUTO_LOGIN:false}

# The settings shared by every ENS application (ENS_* variables; see README).
ens:
  # Content-Security-Policy-Report-Only instead of Content-Security-Policy (escape hatch).
  csp:
    report-only: ${ENS_CSP_REPORT_ONLY:false}
  cookie:
    secure: ${ENS_COOKIE_SECURE:${COOKIE_SECURE:false}}
  # DoD notice-and-consent banner, acknowledged before any sign-in. Empty title and text: the
  # standard DoD wording. ENS_CONSENT_BANNER_FILE (plain text) wins over ENS_CONSENT_BANNER_TEXT.
  consent-banner:
    enabled: ${ENS_CONSENT_BANNER_ENABLED:false}
    title: ${ENS_CONSENT_BANNER_TITLE:}
    text: ${ENS_CONSENT_BANNER_TEXT:}
    file: ${ENS_CONSENT_BANNER_FILE:}
  # Session controls. SESSION_TTL_MINUTES (minutes) is the older name of the idle timeout.
  session:
    idle-timeout: ${ENS_SESSION_IDLE_TIMEOUT:${SESSION_TTL_MINUTES:30}m}
    admin-idle-timeout: ${ENS_SESSION_ADMIN_IDLE_TIMEOUT:}
    absolute-timeout: ${ENS_SESSION_ABSOLUTE_TIMEOUT:12h}
    max-per-user: ${ENS_SESSION_MAX_PER_USER:0}
  # Client-certificate revocation checking and issuer allowlist. ENS_X509_REVOCATION: off, ocsp,
  # crl or ocsp-then-crl. Unset is ocsp-then-crl, soft-fail: a certificate found revoked is
  # refused, and one no OCSP responder or CRL answers for signs in with a warning. Unset or off,
  # with the older X509_CHECK_REVOCATION=true: ocsp-then-crl, failing closed.
  x509:
    revocation: ${ENS_X509_REVOCATION:}
    ocsp-responder-url: ${ENS_X509_OCSP_RESPONDER_URL:}
    crl-dir: ${ENS_X509_CRL_DIR:}
    # closed refuses a certificate whose status cannot be determined; open allows it, warning.
    # Unset: open while ENS_X509_REVOCATION is unset too, closed once a mode is chosen.
    revocation-fail: ${ENS_X509_REVOCATION_FAIL:}
    revocation-cache: ${ENS_X509_REVOCATION_CACHE:10m}
    allowed-issuers: ${ENS_X509_ALLOWED_ISSUERS:}
  # Audit outputs and retention: the shared ENS_AUDIT_* variables (see README, Audit logging).
  audit:
    stdout: ${ENS_AUDIT_STDOUT:true}
    file: ${ENS_AUDIT_FILE:}
    file-keep: ${ENS_AUDIT_FILE_KEEP:30}
    retention-days: ${ENS_AUDIT_RETENTION_DAYS:0}
    query-max-scan: ${ENS_AUDIT_QUERY_MAX_SCAN:2000000}
    splunk:
      url: ${ENS_AUDIT_SPLUNK_URL:}
      token: ${ENS_AUDIT_SPLUNK_TOKEN:}
      token-file: ${ENS_AUDIT_SPLUNK_TOKEN_FILE:}
      index: ${ENS_AUDIT_SPLUNK_INDEX:}
      sourcetype: ${ENS_AUDIT_SPLUNK_SOURCETYPE:ens:audit}
      insecure: ${ENS_AUDIT_SPLUNK_INSECURE:false}
    syslog:
      host: ${ENS_AUDIT_SYSLOG_HOST:}
      port: ${ENS_AUDIT_SYSLOG_PORT:}
      protocol: ${ENS_AUDIT_SYSLOG_PROTOCOL:tcp}
      facility: ${ENS_AUDIT_SYSLOG_FACILITY:local0}

# The ENS license is not a Spring property: ENS_LICENSE_FILE and ENS_LICENSE_STATE_DIR (environment
# only; see README, Licensing). Without a license only sign-in and the license screen work.
