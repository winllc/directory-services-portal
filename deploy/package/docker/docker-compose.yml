# Directory Services Portal @VERSION@ (standalone package).
# Settings live in .env (created by ./install.sh). Start with ./portal.sh up
#
#   web  nginx serving the client on port 8080 and proxying /api to the api service; published
#        on the host as WEB_BIND:WEB_PORT (default 0.0.0.0:8080, plain HTTP)
#   api  the Spring Boot API (never published on the host)
#
# For Docker Compose v2 and podman-compose 1.1+. docker-compose.mtls.yml adds HTTPS (HTTPS_PORT).
# docker-compose.no-publish.yml, used instead of this file, is the same without the published
# port (for a reverse proxy on the compose network).
# The project name is COMPOSE_PROJECT_NAME in .env (no top-level "name:": docker-compose v1
# rejects it).

services:
  api:
    image: ${API_IMAGE:-@API_IMAGE@}
    restart: unless-stopped
    env_file: .env
    # Hardening: no capabilities or privilege escalation, a read-only root file system (the API
    # writes only to its volumes and /tmp) and a memory limit (the JVM sizes its heap from it).
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: ${API_MEMORY_LIMIT:-1536m}
    environment:
      # Fixed by the container layout; everything else comes from .env.
      DATA_DIR: /data
      PORT: "3001"
      # Only the web proxy can reach the API, and it overwrites X-Forwarded-*.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    volumes:
      - portal-data:/data
      # ENS license: the license (uploaded on the license screen, or copied in by install.sh /
      # ./portal.sh license), this installation's id and the license revisions seen. Writable and
      # persistent: upgrades keep it; `docker compose down -v` would delete it.
      - ens-license:/var/lib/ens/directory-portal
      # Audit file output (ENS_AUDIT_FILE=/var/log/ens/directory-portal/audit.jsonl in .env) for a
      # log forwarder to tail. The ENS_AUDIT_* settings reach the API through env_file.
      - ens-audit:/var/log/ens
    healthcheck:
      # Readiness: the directory answers and the audit log is writable.
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/readyz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    image: ${WEB_IMAGE:-@WEB_IMAGE@}
    restart: unless-stopped
    # Hardening: no capabilities or privilege escalation, a read-only root file system (nginx
    # writes its rendered config, pid, temp files and default log to tmpfs) and a memory limit.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
      - /opt/app-root/etc/dsp.d
      - /var/log/nginx
    mem_limit: ${WEB_MEMORY_LIMIT:-256m}
    depends_on:
      - api
    environment:
      API_URL: http://api:3001
      # Content-Security-Policy only reported (escape hatch; the API reads it from .env).
      ENS_CSP_REPORT_ONLY: ${ENS_CSP_REPORT_ONLY:-false}
      # Sent to the API with every request; the API accepts client certificates only with it.
      X509_PROXY_SECRET: ${X509_PROXY_SECRET:-}
      # The header the API reads the client certificate from, removed from client requests
      # unless a TLS proxy in front of this one verifies certificates and always sets it
      # (X509_EDGE_TERMINATION=true; then make sure nothing else can reach the web service).
      X509_HEADER: ${X509_HEADER:-X-SSL-Client-Cert}
      X509_EDGE_TERMINATION: ${X509_EDGE_TERMINATION:-false}
      # The public host:port sent to the API as X-Forwarded-Host (empty: the client's Host).
      PUBLIC_HOST: ${PUBLIC_HOST:-}
    expose:
      - "8080"
    # >>> published port: plain HTTP on the host, on every interface unless WEB_BIND in .env says
    # otherwise. Put a TLS proxy in front, or use docker-compose.mtls.yml. Rootless Podman needs
    # WEB_PORT >= 1024. (docker-compose.no-publish.yml is this file without these lines.)
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:8080"
    # <<< published port
    healthcheck:
      # Any answer will do (with docker-compose.mtls.yml port 8080 redirects to HTTPS).
      test: ["CMD-SHELL", "curl -so /dev/null http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  portal-data:
  ens-license:
  ens-audit:
