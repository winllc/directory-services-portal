{{- $v := .Values -}}
# The API: reached only by the web tier.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dsp.apiName" . }}
  labels:
    {{- include "dsp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with $v.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $v.api.service.port }}
      targetPort: http
      protocol: TCP
    {{- if $v.metrics.enabled }}
    # Health and Prometheus (MANAGEMENT_SERVER_PORT); never route an ingress to it.
    - name: metrics
      port: {{ $v.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
  selector:
    {{- include "dsp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
---
# The portal (web tier): what users, the Ingress and the Route reach.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dsp.fullname" . }}
  labels:
    {{- include "dsp.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with $v.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $v.service.type }}
  {{- if and (eq $v.service.type "LoadBalancer") $v.service.loadBalancerIP }}
  loadBalancerIP: {{ $v.service.loadBalancerIP }}
  {{- end }}
  {{- if and (eq $v.service.type "LoadBalancer") $v.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml $v.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  {{- if and (has $v.service.type (list "LoadBalancer" "NodePort")) $v.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ $v.service.externalTrafficPolicy }}
  {{- end }}
  ports:
    - name: http
      port: {{ $v.service.port }}
      targetPort: http
      protocol: TCP
    {{- if $v.tls.enabled }}
    - name: https
      port: {{ $v.service.httpsPort }}
      targetPort: https
      protocol: TCP
    {{- end }}
  selector:
    {{- include "dsp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
