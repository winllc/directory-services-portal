{{- $v := .Values -}}
{{- if include "dsp.hasChartSecret" . }}
# Inline secret values. Each can come from an existing Secret instead (existingSecret/existingSecretKey).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dsp.fullname" . }}
  labels:
    {{- include "dsp.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $v.ldap.bindPassword.value (not $v.ldap.bindPassword.existingSecret) }}
  ldap-bind-password: {{ $v.ldap.bindPassword.value | b64enc | quote }}
  {{- end }}
  {{- if and $v.audit.splunk.token.value (not $v.audit.splunk.token.existingSecret) }}
  splunk-hec-token: {{ $v.audit.splunk.token.value | b64enc | quote }}
  {{- end }}
  {{- if and $v.ldap.truststore.password.value (not $v.ldap.truststore.password.existingSecret) }}
  truststore-password: {{ $v.ldap.truststore.password.value | b64enc | quote }}
  {{- end }}
  {{- if and $v.database.password.value (not $v.database.password.existingSecret) }}
  database-password: {{ $v.database.password.value | b64enc | quote }}
  {{- end }}
  {{- if and $v.sso.oidc.clientSecret.value (not $v.sso.oidc.clientSecret.existingSecret) }}
  oidc-client-secret: {{ $v.sso.oidc.clientSecret.value | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if and $v.license.file (not $v.license.existingSecret) }}
---
# The license given with --set-file license.file=...; copied into the license volume only when it
# holds no license yet.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dsp.fullname" . }}-license
  labels:
    {{- include "dsp.labels" . | nindent 4 }}
type: Opaque
data:
  license.lic: {{ $v.license.file | b64enc | quote }}
{{- end }}
{{- if and $v.tls.enabled (not $v.tls.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dsp.fullname" . }}-tls
  labels:
    {{- include "dsp.labels" . | nindent 4 }}
type: Opaque
data:
  server.pem: {{ $v.tls.certificate | b64enc | quote }}
  server.key: {{ $v.tls.key | b64enc | quote }}
  ca.pem: {{ $v.tls.clientCa | b64enc | quote }}
{{- end }}
{{- if and $v.x509.trustedCa.value (not $v.x509.trustedCa.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dsp.fullname" . }}-x509-ca
  labels:
    {{- include "dsp.labels" . | nindent 4 }}
type: Opaque
data:
  ca.pem: {{ $v.x509.trustedCa.value | b64enc | quote }}
{{- end }}
{{- if and $v.x509.enabled (not $v.x509.proxySecret.existingSecret) }}
---
# The X.509 proxy secret: the web pods send it to the API with every request, and the API accepts
# a forwarded client certificate only with it. Generated once and kept across upgrades.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dsp.fullname" . }}-x509-proxy
  labels:
    {{- include "dsp.labels" . | nindent 4 }}
type: Opaque
data:
  proxy-secret: {{ include "dsp.x509ProxySecretValue" . | quote }}
{{- end }}
