{{- include "dsp.validate" . -}}
{{- $v := .Values -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dsp.apiName" . }}
  labels:
    {{- include "dsp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
data:
  # Fixed by the container layout.
  DATA_DIR: /data
  PORT: "3001"
  # Only the web tier reaches the API, and it overwrites X-Forwarded-*.
  SERVER_FORWARD_HEADERS_STRATEGY: framework
  JAVA_TOOL_OPTIONS: {{ include "dsp.str" $v.api.javaToolOptions | quote }}
  {{- if $v.metrics.enabled }}
  # Health and Prometheus on their own port (the Service's "metrics" port).
  MANAGEMENT_SERVER_PORT: {{ include "dsp.str" $v.metrics.port | quote }}
  {{- end }}
  {{- if eq $v.logFormat "json" }}
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  {{- end }}
  # Directory connection
  DIRECTORY_MODE: {{ include "dsp.str" $v.directory.mode | quote }}
  # The built-in demo directory's credentials are public: the API starts it only as a demo.
  DEMO_MODE: {{ eq $v.directory.mode "memory" | quote }}
  LDAP_URL: {{ include "dsp.str" $v.ldap.url | quote }}
  LDAP_STARTTLS: {{ include "dsp.str" $v.ldap.startTls | quote }}
  LDAP_TLS_REJECT_UNAUTHORIZED: {{ include "dsp.str" $v.ldap.tlsRejectUnauthorized | quote }}
  LDAP_TIMEOUT_MS: {{ include "dsp.str" $v.ldap.timeoutMs | quote }}
  LDAP_POOL_SIZE: {{ include "dsp.str" $v.ldap.poolSize | quote }}
  LDAP_BIND_DN: {{ include "dsp.str" $v.ldap.bindDn | quote }}
  {{- if include "dsp.secretSet" (dict "v" $v.ldap.bindPassword) }}
  # The bind password, mounted from its Secret (ldap.bindPassword).
  LDAP_BIND_PASSWORD_FILE: /etc/dsp/ldap/bind-password
  {{- end }}
  LDAP_BASE_DN: {{ include "dsp.str" $v.ldap.baseDn | quote }}
  # Users & groups
  LDAP_USER_SEARCH_BASE: {{ include "dsp.str" $v.ldap.userSearchBase | quote }}
  LDAP_USER_FILTER: {{ include "dsp.str" $v.ldap.userFilter | quote }}
  LDAP_USERNAME_ATTRIBUTE: {{ include "dsp.str" $v.ldap.usernameAttribute | quote }}
  LDAP_GROUP_SEARCH_BASE: {{ include "dsp.str" $v.ldap.groupSearchBase | quote }}
  LDAP_GROUP_FILTER: {{ include "dsp.str" $v.ldap.groupFilter | quote }}
  ADMIN_USERS: {{ include "dsp.joinSemi" $v.admin.users | quote }}
  ADMIN_GROUPS: {{ include "dsp.joinSemi" $v.admin.groups | quote }}
  # Server
  ENS_SESSION_IDLE_TIMEOUT: {{ include "dsp.idleTimeout" . | quote }}
  ENS_SESSION_ADMIN_IDLE_TIMEOUT: {{ include "dsp.str" $v.server.session.adminIdleTimeout | quote }}
  ENS_SESSION_ABSOLUTE_TIMEOUT: {{ include "dsp.str" $v.server.session.absoluteTimeout | quote }}
  ENS_SESSION_MAX_PER_USER: {{ include "dsp.str" $v.server.session.maxPerUser | quote }}
  GROUP_REFRESH_INTERVAL: {{ include "dsp.str" $v.server.groupRefreshInterval | quote }}
  LOGIN_MAX_FAILURES: {{ include "dsp.str" $v.server.login.maxFailures | quote }}
  # Integration API, webhooks, import and export
  API_RATE_LIMIT_PER_MINUTE: {{ include "dsp.str" $v.integrations.api.rateLimitPerMinute | quote }}
  API_TOKEN_MAX_DAYS: {{ include "dsp.str" $v.integrations.api.maxTokenDays | quote }}
  WEBHOOKS_ENABLED: {{ $v.integrations.webhooks.enabled | quote }}
  WEBHOOK_ALLOWED_HOSTS: {{ include "dsp.joinSemi" $v.integrations.webhooks.allowedHosts | quote }}
  WEBHOOK_MAX_ATTEMPTS: {{ include "dsp.str" $v.integrations.webhooks.maxAttempts | quote }}
  WEBHOOK_RUN_BUDGET: {{ $v.integrations.webhooks.runBudget | quote }}
  DSP_SECRETS_KEY_FILE: {{ ternary "/etc/dsp/secrets/key" "" (eq (include "dsp.secretsKeySet" .) "true") | quote }}
  EXPORT_MAX_ENTRIES: {{ include "dsp.str" $v.integrations.transfer.exportMaxEntries | quote }}
  IMPORT_MAX_BYTES: {{ include "dsp.str" $v.integrations.transfer.importMaxBytes | quote }}
  IMPORT_MAX_ROWS: {{ include "dsp.str" $v.integrations.transfer.importMaxRows | quote }}
  BULK_MAX_MEMBERS: {{ include "dsp.str" $v.integrations.transfer.bulkMaxMembers | quote }}
  LOGIN_LOCKOUT_WINDOW: {{ include "dsp.str" $v.server.login.lockoutWindow | quote }}
  ENS_COOKIE_SECURE: {{ include "dsp.cookieSecure" . | quote }}
  ENS_CSP_REPORT_ONLY: {{ $v.server.cspReportOnly | quote }}
  SEED_DEMO_CONFIG: {{ include "dsp.str" $v.server.seedDemoConfig | quote }}
  LOGIN_HINT: {{ include "dsp.str" $v.server.loginHint | quote }}
  ENS_CONSENT_BANNER_ENABLED: {{ $v.server.consentBanner.enabled | quote }}
  ENS_CONSENT_BANNER_TITLE: {{ include "dsp.str" $v.server.consentBanner.title | quote }}
  ENS_CONSENT_BANNER_TEXT: {{ include "dsp.str" $v.server.consentBanner.text | quote }}
  BANNER_TEXT: {{ include "dsp.str" $v.server.banner.text | quote }}
  BANNER_FOREGROUND: {{ include "dsp.str" $v.server.banner.foreground | quote }}
  BANNER_BACKGROUND: {{ include "dsp.str" $v.server.banner.background | quote }}
  MAX_HTTP_REQUEST_HEADER_SIZE: {{ include "dsp.str" $v.server.maxHttpRequestHeaderSize | quote }}
  # Shared database (several replicas)
  DSP_DATABASE_URL: {{ include "dsp.str" $v.database.url | quote }}
  DSP_DATABASE_USERNAME: {{ include "dsp.str" $v.database.username | quote }}
  {{- if include "dsp.secretSet" (dict "v" $v.database.password) }}
  DSP_DATABASE_PASSWORD_FILE: /etc/dsp/database/password
  {{- end }}
  DSP_DATABASE_POOL_SIZE: {{ include "dsp.str" $v.database.poolSize | quote }}
  DSP_CONFIG_REFRESH: {{ include "dsp.str" $v.database.configRefresh | quote }}
  # Single sign-on
  PORTAL_PUBLIC_URL: {{ include "dsp.str" $v.server.publicUrl | quote }}
  SSO_IDP_ADMIN_SESSION_LIFETIME: {{ include "dsp.str" $v.sso.idpAdminSessionLifetime | quote }}
  SSO_OIDC_ISSUER_URI: {{ include "dsp.str" $v.sso.oidc.issuerUri | quote }}
  SSO_OIDC_CLIENT_ID: {{ include "dsp.str" $v.sso.oidc.clientId | quote }}
  {{- if include "dsp.secretSet" (dict "v" $v.sso.oidc.clientSecret) }}
  SSO_OIDC_CLIENT_SECRET_FILE: /etc/dsp/sso-oidc/client-secret
  {{- end }}
  SSO_OIDC_SCOPES: {{ include "dsp.str" $v.sso.oidc.scopes | quote }}
  SSO_OIDC_USERNAME_CLAIM: {{ include "dsp.str" $v.sso.oidc.usernameClaim | quote }}
  SSO_OIDC_USER_FILTER: {{ include "dsp.str" $v.sso.oidc.userFilter | quote }}
  SSO_OIDC_GROUPS_CLAIM: {{ include "dsp.str" $v.sso.oidc.groupsClaim | quote }}
  SSO_OIDC_ADMIN_GROUPS: {{ include "dsp.joinSemi" $v.sso.oidc.adminGroups | quote }}
  SSO_OIDC_LABEL: {{ include "dsp.str" $v.sso.oidc.label | quote }}
  {{- with include "dsp.newInstallDefault" (dict "root" . "value" $v.sso.oidc.providerLogout "key" "SSO_OIDC_PROVIDER_LOGOUT") }}
  SSO_OIDC_PROVIDER_LOGOUT: {{ . | quote }}
  {{- end }}
  SSO_SAML_METADATA: {{ ternary "/etc/dsp/sso-saml-metadata/idp-metadata.xml" (include "dsp.str" $v.sso.saml.metadataUrl) (not (empty $v.sso.saml.metadataXml)) | quote }}
  SSO_SAML_ENTITY_ID: {{ include "dsp.str" $v.sso.saml.entityId | quote }}
  SSO_SAML_USERNAME_ATTRIBUTE: {{ include "dsp.str" $v.sso.saml.usernameAttribute | quote }}
  SSO_SAML_USER_FILTER: {{ include "dsp.str" $v.sso.saml.userFilter | quote }}
  SSO_SAML_GROUPS_ATTRIBUTE: {{ include "dsp.str" $v.sso.saml.groupsAttribute | quote }}
  SSO_SAML_ADMIN_GROUPS: {{ include "dsp.joinSemi" $v.sso.saml.adminGroups | quote }}
  SSO_SAML_LABEL: {{ include "dsp.str" $v.sso.saml.label | quote }}
  SSO_SAML_CLOCK_SKEW: {{ include "dsp.str" $v.sso.saml.clockSkew | quote }}
  {{- with include "dsp.newInstallDefault" (dict "root" . "value" $v.sso.saml.singleLogout "key" "SSO_SAML_SINGLE_LOGOUT") }}
  SSO_SAML_SINGLE_LOGOUT: {{ . | quote }}
  {{- end }}
  {{- if $v.sso.saml.signing.existingSecret }}
  SSO_SAML_SIGNING_KEY_FILE: /etc/dsp/sso-saml-signing/signing.key
  SSO_SAML_SIGNING_CERT_FILE: /etc/dsp/sso-saml-signing/signing.crt
  {{- end }}
  # Audit log
  AUDIT_DIR: {{ include "dsp.str" $v.audit.dir | quote }}
  AUDIT_MEMORY_EVENTS: {{ include "dsp.str" $v.audit.memoryEvents | quote }}
  ENS_AUDIT_STDOUT: {{ include "dsp.str" $v.audit.stdout | quote }}
  ENS_AUDIT_FILE: {{ ternary $v.audit.file.path "" (and $v.audit.file.enabled true) | quote }}
  ENS_AUDIT_FILE_KEEP: {{ include "dsp.str" $v.audit.file.keep | quote }}
  ENS_AUDIT_RETENTION_DAYS: {{ include "dsp.str" $v.audit.retentionDays | quote }}
  ENS_AUDIT_SPLUNK_URL: {{ include "dsp.str" $v.audit.splunk.url | quote }}
  ENS_AUDIT_SPLUNK_INDEX: {{ include "dsp.str" $v.audit.splunk.index | quote }}
  ENS_AUDIT_SPLUNK_SOURCETYPE: {{ include "dsp.str" $v.audit.splunk.sourcetype | quote }}
  ENS_AUDIT_SPLUNK_INSECURE: {{ include "dsp.str" $v.audit.splunk.insecure | quote }}
  ENS_AUDIT_SYSLOG_HOST: {{ include "dsp.str" $v.audit.syslog.host | quote }}
  ENS_AUDIT_SYSLOG_PORT: {{ include "dsp.str" $v.audit.syslog.port | quote }}
  ENS_AUDIT_SYSLOG_PROTOCOL: {{ include "dsp.str" $v.audit.syslog.protocol | quote }}
  ENS_AUDIT_SYSLOG_FACILITY: {{ include "dsp.str" $v.audit.syslog.facility | quote }}
  # Metrics, analysis and background tasks
  METRICS_MAX_ENTRIES: {{ include "dsp.str" $v.metrics.maxEntries | quote }}
  METRICS_CACHE_SECONDS: {{ include "dsp.str" $v.metrics.cacheSeconds | quote }}
  METRICS_WAIT_MILLIS: {{ include "dsp.str" $v.metrics.waitMillis | quote }}
  ANALYSIS_MAX_ISSUES: {{ include "dsp.str" $v.analysis.maxIssues | quote }}
  JOBS_METRICS_THREADS: {{ include "dsp.str" $v.jobs.metricsThreads | quote }}
  JOBS_ANALYSIS_THREADS: {{ include "dsp.str" $v.jobs.analysisThreads | quote }}
  JOBS_MAX_ACTIVE_PER_USER: {{ include "dsp.str" $v.jobs.maxActivePerUser | quote }}
  JOBS_RETAIN_MINUTES: {{ include "dsp.str" $v.jobs.retainMinutes | quote }}
  # X.509 client-certificate sign-in
  PASSWORD_LOGIN_ENABLED: {{ $v.x509.passwordLoginEnabled | quote }}
  X509_ENABLED: {{ $v.x509.enabled | quote }}
  X509_SOURCE: header
  X509_HEADER: {{ include "dsp.x509Header" . | quote }}
  X509_TRUSTED_PROXIES: {{ $v.x509.trustedProxies | quote }}
  X509_PROXY_SECRET_FILE: {{ ternary "/etc/dsp/x509-proxy/proxy-secret" "" (and $v.x509.enabled true) | quote }}
  X509_TRUSTED_CA_FILE: {{ ternary "/etc/dsp/x509/ca.pem" "" (eq (include "dsp.x509CaConfigured" .) "true") | quote }}
  X509_CHECK_REVOCATION: {{ $v.x509.checkRevocation | quote }}
  {{- $rev := $v.x509.revocation }}
  ENS_X509_REVOCATION: {{ toString $rev.mode | quote }}
  ENS_X509_OCSP_RESPONDER_URL: {{ $rev.ocspResponderUrl | quote }}
  ENS_X509_CRL_DIR: {{ $rev.crlDir | quote }}
  ENS_X509_REVOCATION_FAIL: {{ $rev.fail | quote }}
  ENS_X509_REVOCATION_CACHE: {{ $rev.cache | quote }}
  ENS_X509_ALLOWED_ISSUERS: {{ include "dsp.joinSemi" $v.x509.allowedIssuers | quote }}
  X509_MAPPING: {{ $v.x509.mapping | quote }}
  X509_USER_FILTER: {{ $v.x509.userFilter | quote }}
  X509_REQUIRE_CERTIFICATE_MATCH: {{ $v.x509.requireCertificateMatch | quote }}
  X509_AUTO_LOGIN: {{ $v.x509.autoLogin | quote }}
{{- if include "dsp.samlMetadataXml" . }}
---
# The SAML IdP's metadata (sso.saml.metadataXml), mounted at /etc/dsp/sso-saml-metadata.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dsp.apiName" . }}-saml-idp
  labels:
    {{- include "dsp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
data:
  idp-metadata.xml: {{ $v.sso.saml.metadataXml | quote }}
{{- end }}
