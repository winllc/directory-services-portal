{{- $v := .Values -}}
{{- $licenseGiven := or $v.license.existingSecret $v.license.file -}}
{{- $truststore := $v.ldap.truststore -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dsp.apiName" . }}
  labels:
    {{- include "dsp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # More than one replica only with the shared database (see api.replicaCount in values.yaml).
  replicas: {{ $v.api.replicaCount }}
  revisionHistoryLimit: {{ $v.revisionHistoryLimit }}
  strategy:
    {{- if eq (include "dsp.apiStrategy" .) "Recreate" }}
    # A ReadWriteOnce volume is mounted: the old pod stops before the new one starts.
    type: Recreate
    {{- else }}
    # A new pod must be ready before an old one stops: upgrades without downtime.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- end }}
  selector:
    matchLabels:
      {{- include "dsp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "dsp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with $v.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with $v.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "dsp.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with $v.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.api.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- include "dsp.podSecurityContext" (dict "ctx" $v.api.podSecurityContext "root" .) | nindent 8 }}
      {{- if $licenseGiven }}
      initContainers:
        # Copies the given license into the license volume only when no license is installed there
        # yet (as the release bundle's install.sh does), so a license uploaded later on the license
        # screen is never overwritten by an upgrade.
        - name: license-init
          image: {{ include "dsp.image" (dict "image" $v.api.image "root" .) }}
          imagePullPolicy: {{ $v.api.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              f="$ENS_LICENSE_FILE"
              mkdir -p "$(dirname "$f")" "$ENS_LICENSE_STATE_DIR"
              if [ -s "$f" ]; then
                echo "license-init: a license is already installed ($f); keeping it"
              elif ! grep -q -- '-----BEGIN ENS LICENSE-----' /license-src/license.lic; then
                echo "license-init: the given license is not an ENS license file; not installed" >&2
              else
                cp /license-src/license.lic "$f.new" && mv -f "$f.new" "$f"
                echo "license-init: installed the given license into $f"
              fi
          env:
            - name: ENS_LICENSE_STATE_DIR
              value: /var/lib/ens/directory-portal
            - name: ENS_LICENSE_FILE
              value: /var/lib/ens/directory-portal/license.lic
          securityContext:
            {{- include "dsp.containerSecurityContext" (dict "ctx" $v.api.securityContext "root" .) | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: license
              mountPath: /var/lib/ens
            - name: license-src
              mountPath: /license-src
              readOnly: true
      {{- end }}
      containers:
        - name: api
          image: {{ include "dsp.image" (dict "image" $v.api.image "root" .) }}
          imagePullPolicy: {{ $v.api.image.pullPolicy }}
          securityContext:
            {{- include "dsp.containerSecurityContext" (dict "ctx" $v.api.securityContext "root" .) | nindent 12 }}
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
            {{- if $v.metrics.enabled }}
            - name: metrics
              containerPort: {{ $v.metrics.port }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "dsp.apiName" . }}
            {{- with $v.api.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            # As in the image: the license and this installation's id, on the license volume.
            - name: ENS_LICENSE_STATE_DIR
              value: /var/lib/ens/directory-portal
            - name: ENS_LICENSE_FILE
              value: /var/lib/ens/directory-portal/license.lic
            {{- if include "dsp.secretSet" (dict "v" $v.audit.splunk.token) }}
            - name: ENS_AUDIT_SPLUNK_TOKEN
              valueFrom:
                {{- include "dsp.secretRef" (dict "v" $v.audit.splunk.token "chartKey" "splunk-hec-token" "root" .) | nindent 16 }}
            {{- end }}
            {{- if and $truststore.existingSecret (include "dsp.secretSet" (dict "v" $truststore.password)) }}
            - name: DSP_TRUSTSTORE_PASSWORD
              valueFrom:
                {{- include "dsp.secretRef" (dict "v" $truststore.password "chartKey" "truststore-password" "root" .) | nindent 16 }}
            {{- end }}
            # Passed to java by the image's entrypoint (not echoed by the JVM, unlike JAVA_TOOL_OPTIONS).
            - name: JAVA_OPTS
              value: {{ include "dsp.javaOpts" . | quote }}
            {{- with $v.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if $v.api.startupProbe.enabled }}
          startupProbe:
            httpGet:
              {{- include "dsp.apiProbe" (dict "group" "liveness" "root" .) | nindent 14 }}
            initialDelaySeconds: {{ $v.api.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ $v.api.startupProbe.periodSeconds }}
            timeoutSeconds: {{ $v.api.startupProbe.timeoutSeconds }}
            failureThreshold: {{ $v.api.startupProbe.failureThreshold }}
          {{- end }}
          {{- if $v.api.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              {{- include "dsp.apiProbe" (dict "group" "liveness" "root" .) | nindent 14 }}
            periodSeconds: {{ $v.api.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ $v.api.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ $v.api.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if $v.api.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              {{- include "dsp.apiProbe" (dict "group" "readiness" "root" .) | nindent 14 }}
            periodSeconds: {{ $v.api.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ $v.api.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ $v.api.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml $v.api.resources | nindent 12 }}
          volumeMounts:
            - name: license
              mountPath: /var/lib/ens
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if $v.audit.file.enabled }}
            - name: audit-log
              mountPath: /var/log/ens
            {{- end }}
            {{- if include "dsp.x509CaConfigured" . }}
            - name: x509-ca
              mountPath: /etc/dsp/x509
              readOnly: true
            {{- end }}
            {{- if $v.x509.enabled }}
            - name: x509-proxy
              mountPath: /etc/dsp/x509-proxy
              readOnly: true
            {{- end }}
            {{- if $truststore.existingSecret }}
            - name: truststore
              mountPath: /etc/dsp/truststore
              readOnly: true
            {{- end }}
            {{- if include "dsp.secretSet" (dict "v" $v.database.password) }}
            - name: database-password
              mountPath: /etc/dsp/database
              readOnly: true
            {{- end }}
            {{- if include "dsp.secretSet" (dict "v" $v.sso.oidc.clientSecret) }}
            - name: oidc-client-secret
              mountPath: /etc/dsp/sso-oidc
              readOnly: true
            {{- end }}
            {{- if include "dsp.samlMetadataXml" . }}
            - name: saml-metadata
              mountPath: /etc/dsp/sso-saml-metadata
              readOnly: true
            {{- end }}
            {{- if $v.sso.saml.signing.existingSecret }}
            - name: saml-signing
              mountPath: /etc/dsp/sso-saml-signing
              readOnly: true
            {{- end }}
            {{- if include "dsp.secretSet" (dict "v" $v.ldap.bindPassword) }}
            # LDAP_BIND_PASSWORD_FILE: a file, not an environment variable anyone inspecting the
            # pod or process can read.
            - name: ldap-bind-password
              mountPath: /etc/dsp/ldap
              readOnly: true
            {{- end }}
            {{- with $v.api.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: license
          {{- if $v.persistence.license.enabled }}
          persistentVolumeClaim:
            claimName: {{ $v.persistence.license.existingClaim | default (printf "%s-license" (include "dsp.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: data
          {{- if $v.persistence.data.enabled }}
          persistentVolumeClaim:
            claimName: {{ $v.persistence.data.existingClaim | default (printf "%s-data" (include "dsp.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if $v.audit.file.enabled }}
        - name: audit-log
          {{- if $v.audit.file.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $v.audit.file.persistence.existingClaim | default (printf "%s-audit" (include "dsp.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if $licenseGiven }}
        - name: license-src
          secret:
            secretName: {{ include "dsp.licenseSecretName" . }}
            items:
              - key: license.lic
                path: license.lic
        {{- end }}
        {{- if include "dsp.x509CaConfigured" . }}
        - name: x509-ca
          secret:
            {{- if $v.x509.trustedCa.existingSecret }}
            secretName: {{ $v.x509.trustedCa.existingSecret }}
            items:
              - key: {{ $v.x509.trustedCa.existingSecretKey }}
                path: ca.pem
            {{- else if $v.x509.trustedCa.value }}
            secretName: {{ include "dsp.fullname" . }}-x509-ca
            items:
              - key: ca.pem
                path: ca.pem
            {{- else }}
            secretName: {{ include "dsp.tlsSecretName" . }}
            items:
              - key: ca.pem
                path: ca.pem
            {{- end }}
        {{- end }}
        {{- if $v.x509.enabled }}
        - name: x509-proxy
          secret:
            secretName: {{ include "dsp.x509ProxySecretName" . }}
            # Group-readable: the API runs as the pod's fsGroup.
            defaultMode: 0440
            items:
              - key: {{ include "dsp.x509ProxySecretKey" . }}
                path: proxy-secret
        {{- end }}
        {{- if include "dsp.secretSet" (dict "v" $v.database.password) }}
        - name: database-password
          secret:
            secretName: {{ $v.database.password.existingSecret | default (include "dsp.fullname" .) }}
            # Group-readable: the API runs as the pod's fsGroup.
            defaultMode: 0440
            items:
              - key: {{ ternary $v.database.password.existingSecretKey "database-password" (not (empty $v.database.password.existingSecret)) }}
                path: password
        {{- end }}
        {{- if include "dsp.secretSet" (dict "v" $v.sso.oidc.clientSecret) }}
        - name: oidc-client-secret
          secret:
            secretName: {{ $v.sso.oidc.clientSecret.existingSecret | default (include "dsp.fullname" .) }}
            defaultMode: 0440
            items:
              - key: {{ ternary $v.sso.oidc.clientSecret.existingSecretKey "oidc-client-secret" (not (empty $v.sso.oidc.clientSecret.existingSecret)) }}
                path: client-secret
        {{- end }}
        {{- if include "dsp.samlMetadataXml" . }}
        - name: saml-metadata
          configMap:
            name: {{ include "dsp.apiName" . }}-saml-idp
        {{- end }}
        {{- if $v.sso.saml.signing.existingSecret }}
        - name: saml-signing
          secret:
            secretName: {{ $v.sso.saml.signing.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ $v.sso.saml.signing.certificateKey }}
                path: signing.crt
              - key: {{ $v.sso.saml.signing.privateKeyKey }}
                path: signing.key
        {{- end }}
        {{- if include "dsp.secretSet" (dict "v" $v.ldap.bindPassword) }}
        - name: ldap-bind-password
          secret:
            secretName: {{ $v.ldap.bindPassword.existingSecret | default (include "dsp.fullname" .) }}
            # Group-readable: the API runs as the pod's fsGroup.
            defaultMode: 0440
            items:
              - key: {{ ternary $v.ldap.bindPassword.existingSecretKey "ldap-bind-password" (not (empty $v.ldap.bindPassword.existingSecret)) }}
                path: bind-password
        {{- end }}
        {{- if $truststore.existingSecret }}
        - name: truststore
          secret:
            secretName: {{ $truststore.existingSecret }}
            items:
              - key: {{ $truststore.key }}
                path: {{ $truststore.key }}
        {{- end }}
        {{- with $v.api.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $v.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
