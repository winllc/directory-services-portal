# One replica with SAML single sign-on from inline IdP metadata and a signing key, and the shared
# database with an inline password (the chart's Secret).
ldap:
  url: ldaps://ldap.corp.example:636
  bindDn: cn=portal,ou=system,dc=corp,dc=example
  bindPassword:
    value: change-me
  baseDn: dc=corp,dc=example
database:
  url: jdbc:postgresql://postgres:5432/dsp
  username: dsp
  password:
    value: change-me-too
sso:
  saml:
    metadataXml: |
      <md:EntityDescriptor xmlns:md="urn:oasis:names:tc:SAML:2.0:metadata" entityID="http://adfs.corp.example/adfs/services/trust">
        <md:IDPSSODescriptor protocolSupportEnumeration="urn:oasis:names:tc:SAML:2.0:protocol">
          <md:SingleSignOnService Binding="urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect" Location="https://adfs.corp.example/adfs/ls/"/>
        </md:IDPSSODescriptor>
      </md:EntityDescriptor>
    usernameAttribute: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/upn
    userFilter: (&(objectClass=user)(userPrincipalName={{value}}))
    signing:
      existingSecret: dsp-saml-signing
server:
  cookieSecure: true
