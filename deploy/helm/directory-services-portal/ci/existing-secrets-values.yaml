# Every secret from existing Secrets; LDAPS trust store; Splunk HEC; air-gapped registry.
global:
  imageRegistry: registry.corp.example:5000
imagePullSecrets:
  - name: corp-registry
ldap:
  url: ldaps://ldap.corp.example:636
  bindDn: cn=portal,ou=system,dc=corp,dc=example
  bindPassword:
    existingSecret: dsp-secrets
    existingSecretKey: ldap-bind-password
  baseDn: dc=corp,dc=example
  truststore:
    existingSecret: dsp-truststore
    key: truststore.p12
    password:
      existingSecret: dsp-secrets
      existingSecretKey: truststore-password
license:
  existingSecret: dsp-license
audit:
  splunk:
    url: https://splunk.corp.example:8088
    index: ens
    token:
      existingSecret: dsp-secrets
      existingSecretKey: splunk-hec-token
persistence:
  license:
    existingClaim: dsp-license
