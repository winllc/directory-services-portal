# Minimal install: an LDAP directory, the bind password inline, plain HTTP inside the cluster.
ldap:
  url: ldaps://ldap.corp.example:636
  bindDn: cn=portal,ou=system,dc=corp,dc=example
  bindPassword:
    value: change-me
  baseDn: dc=corp,dc=example
  userSearchBase: ou=people,dc=corp,dc=example
  groupSearchBase: ou=groups,dc=corp,dc=example
admin:
  groups:
    - cn=directory-admins,ou=groups,dc=corp,dc=example
