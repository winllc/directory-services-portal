# X.509 sign-in with edge termination: ingress-nginx verifies the client certificate and forwards
# it in the ssl-client-cert header; the API trusts that header from the web pods only.
ldap:
  url: ldaps://ldap.corp.example:636
  bindPassword:
    value: change-me
x509:
  enabled: true
  header: ssl-client-cert
  trustedCa:
    existingSecret: dsp-client-ca
    existingSecretKey: ca.crt
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-secret: portal/dsp-client-ca
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "optional"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "3"
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
  hosts:
    - host: portal.corp.example
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: portal-tls
      hosts: [portal.corp.example]
networkPolicy:
  enabled: true
  webIngressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
