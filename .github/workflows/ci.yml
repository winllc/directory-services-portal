name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Test the API
        working-directory: backend
        run: ./mvnw -B test

  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test -w web

  image:
    # Builds both images on every push, checks the pair starts and answers through the web
    # tier, and publishes what it just checked. Nothing is published from a pull request: a
    # fork's token cannot write packages, and unreviewed code is not for the registry.
    runs-on: ubuntu-latest
    needs: [api-test, web-test]

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Work out the API tags
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Work out the web tags
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: dsp-api:ci
          labels: ${{ steps.api-meta.outputs.labels }}
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          load: true
          tags: dsp-web:ci
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Check they start and answer through the web tier
        run: |
          # The embedded directory and demo configuration, so nothing else is needed: what is
          # checked is that both images are assembled correctly and the web tier reaches the API.
          docker network create dsp
          docker run -d --name api --network dsp \
            -e DIRECTORY_MODE=memory -e SEED_DEMO_CONFIG=true dsp-api:ci
          docker run -d --name web --network dsp -p 8080:8080 -e API_URL=http://api:3001 dsp-web:ci
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "answered after ${i}s"
              curl -fsS http://localhost:8080/api/health
              curl -fsS -o /dev/null http://localhost:8080/
              exit 0
            fi
            sleep 1
          done
          echo "did not answer"
          docker logs api
          docker logs web
          exit 1

      - name: Sign in to the registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name == 'push'
        env:
          API_TAGS: ${{ steps.api-meta.outputs.tags }}
          WEB_TAGS: ${{ steps.web-meta.outputs.tags }}
        run: |
          # Tag and push the images that were just started rather than building them again:
          # the base images are floating tags, and what is published has to be what was tested.
          for tag in $API_TAGS; do docker tag dsp-api:ci "$tag"; docker push "$tag"; done
          for tag in $WEB_TAGS; do docker tag dsp-web:ci "$tag"; docker push "$tag"; done
          {
            echo "### Published"
            echo
            echo '```'
            echo "$API_TAGS"
            echo "$WEB_TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
