name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Test the API
        working-directory: backend
        run: ./mvnw -B test

  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      # Known vulnerabilities in what ships (the web client's runtime dependencies) fail the build.
      - name: Audit the runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test -w web

  helm:
    # The Helm chart: lint it and validate what it renders, for every example values file.
    runs-on: ubuntu-latest
    env:
      CHART: deploy/helm/directory-services-portal
      KUBECONFORM_VERSION: v0.6.7
      KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      - name: Install kubeconform
        run: |
          curl -fsSLo "$RUNNER_TEMP/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint the chart
        run: |
          helm lint --strict "$CHART"
          for f in "$CHART"/ci/*.yaml; do
            echo "::group::helm lint $f"
            helm lint --strict "$CHART" -f "$f"
            echo "::endgroup::"
          done

      - name: Validate the rendered manifests
        run: |
          for f in "$CHART"/ci/*.yaml; do
            echo "::group::kubeconform $f"
            # The OpenShift Route and the Prometheus Operator's ServiceMonitor have no schema in the
            # Kubernetes catalogue.
            extra=()
            case "$f" in *openshift*|*metrics*) extra=(-ignore-missing-schemas) ;; esac
            helm template dsp "$CHART" -f "$f" \
              | kubeconform -strict -summary -kubernetes-version 1.29.0 "${extra[@]}"
            echo "::endgroup::"
          done

      - name: Check the X.509 guards
        run: |
          # Edge-terminated X.509 sign-in trusts the certificate header the ingress controller
          # sets: the chart must refuse it unless only the ingress controller can reach the web
          # pods (or the escape hatch is set), refuse it without trusted CAs, and give both pods
          # the proxy secret the API requires with the header.
          edge="$CHART/ci/edge-x509-values.yaml"
          fails() { # fails EXPECTED-MESSAGE HELM-ARGS...
            local want="$1" out; shift
            if out="$(helm template dsp "$CHART" "$@" 2>&1)"; then echo "rendered, expected: $want"; exit 1; fi
            grep -qF -- "$want" <<<"$out" || { echo "$out"; exit 1; }
          }
          fails "networkPolicy.webIngressFrom" -f "$edge" --set networkPolicy.enabled=false
          fails "networkPolicy.webIngressFrom" -f "$edge" --set networkPolicy.webIngressFrom=null
          fails "x509.enabled needs x509.trustedCa" -f "$edge" --set x509.trustedCa.existingSecret=
          helm template dsp "$CHART" -f "$edge" --set networkPolicy.enabled=false \
            --set x509.allowUnrestrictedWebIngress=true > /dev/null
          for t in api-deployment web-deployment; do
            helm template dsp "$CHART" -f "$edge" --show-only "templates/$t.yaml" \
              | grep -q 'secretName: dsp-directory-services-portal-x509-proxy' || { echo "$t: no proxy secret"; exit 1; }
          done
          helm template dsp "$CHART" -f "$edge" --show-only templates/configmap.yaml \
            | grep -q 'X509_PROXY_SECRET_FILE: "/etc/dsp/x509-proxy/proxy-secret"'
          helm template dsp "$CHART" -f "$edge" --show-only templates/web-deployment.yaml \
            | grep -A1 'name: X509_PROXY_SECRET_FILE' | grep -q '/etc/dsp/x509-proxy/proxy-secret'
          helm template dsp "$CHART" -f "$edge" --show-only templates/web-deployment.yaml \
            | grep -A1 'name: X509_EDGE_TERMINATION' | grep -q '"true"'
          # Revocation is left to the API's default (ocsp-then-crl, soft-fail), whose OCSP and CRL
          # fetches the NetworkPolicy lets out; "off" still turns both off.
          cm="$(helm template dsp "$CHART" -f "$edge" --show-only templates/configmap.yaml)"
          grep -qx '  ENS_X509_REVOCATION: ""' <<<"$cm"
          grep -qx '  ENS_X509_REVOCATION_FAIL: ""' <<<"$cm"
          egress() { helm template dsp "$CHART" -f "$edge" "$@" --show-only templates/networkpolicy.yaml | grep -c 'cidr: 0.0.0.0/0' || true; }
          [ "$(egress)" -gt "$(egress --set x509.revocation.mode=off)" ] || { echo "no revocation egress by default"; exit 1; }

      - name: Check the replica guards
        run: |
          # More than one API replica needs the shared database and volumes that don't pin pods to
          # a node; one replica renders as before (Recreate, no PodDisruptionBudget).
          ha="$CHART/ci/ha-values.yaml"
          fails() { # fails EXPECTED-MESSAGE HELM-ARGS...
            local want="$1" out; shift
            if out="$(helm template dsp "$CHART" "$@" 2>&1)"; then echo "rendered, expected: $want"; exit 1; fi
            grep -qF -- "$want" <<<"$out" || { echo "$out"; exit 1; }
          }
          fails "needs database.url" -f "$ha" --set database.url=
          # Several replicas with the database: the license state is in the database, so the
          # ReadWriteOnce license PVC is kept (never deleted by Helm) but not mounted, and a given
          # license reaches the API as ENS_LICENSE; one replica still mounts it (first-start import).
          api="$(helm template dsp "$CHART" -f "$ha" --show-only templates/api-deployment.yaml)"
          if grep -q 'claimName: dsp-directory-services-portal-license' <<<"$api"; then echo "license PVC mounted by several replicas"; exit 1; fi
          grep -q 'name: ENS_LICENSE$' <<<"$api"
          grep -A1 'name: ENS_LICENSE_EXPECT_INSTALLATION_ID' <<<"$api" | grep -q '"true"'
          if helm template dsp "$CHART" -f "$ha" --set api.replicaCount=1 --set persistence.data.enabled=true --show-only templates/api-deployment.yaml \
            | grep -q ENS_LICENSE_EXPECT_INSTALLATION_ID; then echo "EXPECT with the license volume mounted"; exit 1; fi
          if grep -q 'name: license-init' <<<"$api"; then echo "license-init without the license volume"; exit 1; fi
          helm template dsp "$CHART" -f "$ha" --set api.replicaCount=1 --set persistence.data.enabled=true --show-only templates/api-deployment.yaml \
            | grep -q 'claimName: dsp-directory-services-portal-license'
          helm template dsp "$CHART" -f "$ha" --show-only templates/pvc.yaml | grep -q 'helm.sh/resource-policy: keep'
          fails "persistence.data ReadWriteOnce" -f "$ha" --set persistence.data.enabled=true
          fails "api.updateStrategy RollingUpdate with a ReadWriteOnce volume" -f "$CHART/ci/default-values.yaml" --set api.updateStrategy=RollingUpdate --set database.url=jdbc:postgresql://db:5432/dsp
          fails "database.url must be a PostgreSQL JDBC URL" -f "$CHART/ci/default-values.yaml" --set database.url=postgres://x
          # Without the database two pods must never overlap, even on ReadWriteMany storage.
          rwx=(-f "$CHART/ci/default-values.yaml" --set 'persistence.license.accessModes={ReadWriteMany}' --set persistence.data.enabled=false)
          fails "api.updateStrategy RollingUpdate needs database.url" "${rwx[@]}" --set api.updateStrategy=RollingUpdate
          helm template dsp "$CHART" "${rwx[@]}" --show-only templates/api-deployment.yaml | grep -q 'type: Recreate'
          # SAML's entity id must not come from the request's Host.
          fails "sso.saml needs server.publicUrl" -f "$CHART/ci/saml-values.yaml" --set server.publicUrl=
          for bad in http://portal.example.com https://user@portal.example.com https://portal.example.com/path 'https://portal example.com'; do
            fails "server.publicUrl must be https://host" -f "$CHART/ci/saml-values.yaml" --set "server.publicUrl=$bad"
          done
          helm template dsp "$CHART" -f "$CHART/ci/saml-values.yaml" --set server.publicUrl=http://localhost:8080 > /dev/null
          helm template dsp "$CHART" -f "$ha" --show-only templates/web-deployment.yaml | grep -A1 'name: PUBLIC_HOST' | grep -q '"portal.corp.example"'
          # One replica as before: Recreate, no PodDisruptionBudget, no database or SSO settings.
          one="$(helm template dsp "$CHART" -f "$CHART/ci/default-values.yaml")"
          grep -q 'type: Recreate' <<<"$one"
          if grep -q 'kind: PodDisruptionBudget' <<<"$one"; then echo "a PodDisruptionBudget for one replica"; exit 1; fi
          grep -qx '  DSP_DATABASE_URL: ""' <<<"$one"
          grep -qx '  SSO_OIDC_ISSUER_URI: ""' <<<"$one"
          # Several: rolling updates, a PodDisruptionBudget, secrets as files.
          many="$(helm template dsp "$CHART" -f "$ha")"
          grep -q 'type: RollingUpdate' <<<"$many"
          grep -q 'kind: PodDisruptionBudget' <<<"$many"
          grep -qx '  DSP_DATABASE_PASSWORD_FILE: /etc/dsp/database/password' <<<"$many"
          grep -qx '  SSO_OIDC_CLIENT_SECRET_FILE: /etc/dsp/sso-oidc/client-secret' <<<"$many"
          grep -q 'port: 5432' <<<"$many"
          echo "HA guards OK"

  image:
    # Builds both images on every push, checks the pair starts and answers through the web
    # tier, and publishes what it just checked. Nothing is published from a pull request: a
    # fork's token cannot write packages, and unreviewed code is not for the registry.
    runs-on: ubuntu-latest
    needs: [api-test, web-test, helm]

    permissions:
      contents: write
      packages: write
      # Attach bundle assets to GitHub Releases and keylessly sign images and the chart.
      id-token: write

    env:
      # Release bundles: signing and upload are skipped when these aren't configured. Secrets
      # can't be tested in a step's "if", so they are turned into flags here.
      HAS_GPG: ${{ secrets.RELEASE_GPG_PRIVATE_KEY != '' }}
      HAS_AWS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
      S3_BUCKET: ${{ vars.RELEASE_S3_BUCKET }}
      TRIVY_VERSION: "0.75.0"
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Work out the API tags
        id: api-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Work out the web tags
        id: web-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build the API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          tags: dsp-api:ci
          labels: ${{ steps.api-meta.outputs.labels }}
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/Dockerfile
          load: true
          tags: dsp-web:ci
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Check they start and answer through the web tier
        run: |
          # The embedded directory and demo configuration, so nothing else is needed: what is
          # checked is that both images are assembled correctly and the web tier reaches the API.
          docker network create dsp
          docker run -d --name api --network dsp \
            -e DIRECTORY_MODE=memory -e SEED_DEMO_CONFIG=true dsp-api:ci
          docker run -d --name web --network dsp -p 8080:8080 -e API_URL=http://api:3001 dsp-web:ci
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "answered after ${i}s"
              curl -fsS http://localhost:8080/api/health
              curl -fsS -o /dev/null http://localhost:8080/
              # Unlicensed (the image only trusts the production key and has no license): sign-in
              # works, everything else answers license_required.
              curl -fsS -c /tmp/jar -H 'X-DSP-Request: 1' -H 'Content-Type: application/json' \
                -d '{"username":"alice","password":"password"}' http://localhost:8080/api/auth/login > /dev/null
              curl -sS -b /tmp/jar http://localhost:8080/api/definitions | tee /dev/stderr | grep -q '"code":"license_required"'
              # The probes, on the API itself (the web tier publishes only /api).
              docker exec api curl -fsS http://localhost:3001/readyz
              docker exec api curl -fsS http://localhost:3001/livez
              # The web tier publishes no actuator endpoint (the path is just the client's page).
              ! curl -s http://localhost:8080/actuator/health | grep -q '"status"'
              exit 0
            fi
            sleep 1
          done
          echo "did not answer"
          docker logs api
          docker logs web
          exit 1

      - name: Scan the images
        run: |
          # HIGH and CRITICAL vulnerabilities with a fix available fail the build; accepted risks
          # are listed, with their reason and a review date, in .trivyignore.
          curl -fsSLo "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/trivy"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy" trivy
          for image in dsp-api:ci dsp-web:ci; do
            echo "::group::trivy $image"
            "$RUNNER_TEMP/trivy/trivy" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --ignorefile .trivyignore --no-progress "$image"
            echo "::endgroup::"
          done

      - name: Sign in to the registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name == 'push'
        env:
          API_TAGS: ${{ steps.api-meta.outputs.tags }}
          WEB_TAGS: ${{ steps.web-meta.outputs.tags }}
        run: |
          # Tag and push the images that were just started rather than building them again:
          # what is published has to be what was tested (and scanned).
          for tag in $API_TAGS; do docker tag dsp-api:ci "$tag"; docker push "$tag"; done
          for tag in $WEB_TAGS; do docker tag dsp-web:ci "$tag"; docker push "$tag"; done
          {
            echo "### Published"
            echo
            echo '```'
            echo "$API_TAGS"
            echo "$WEB_TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # --- Customer release bundle -------------------------------------------------------
      # On a v* tag: the bundle of the images just tested and published, signed and uploaded to
      # the release bucket. On a pull request: a dry run that proves the bundle builds.

      - name: Decide the release bundle version
        id: bundle
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"; release=true
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            version="0.0.0-pr${PR_NUMBER}"; release=false
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "enabled=true"
            echo "version=$version"
            echo "release=$release"
            echo "dir=$RUNNER_TEMP/release-bundle"
          } >> "$GITHUB_OUTPUT"

      - name: Set up syft
        id: syft
        if: steps.bundle.outputs.enabled == 'true'
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Set up Helm
        if: steps.bundle.outputs.enabled == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      - name: Package the Helm chart
        id: chart
        if: steps.bundle.outputs.enabled == 'true'
        env:
          VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          # version and appVersion from the release (0.0.0-pr<N> on a pull request); the chart's
          # default image tag is its appVersion, i.e. the images just published.
          mkdir -p "$RUNNER_TEMP/chart"
          helm package deploy/helm/directory-services-portal --version "$VERSION" --app-version "$VERSION" \
            --destination "$RUNNER_TEMP/chart"
          echo "file=$RUNNER_TEMP/chart/directory-services-portal-$VERSION.tgz" >> "$GITHUB_OUTPUT"

      - name: Build the release bundle
        id: release-bundle
        if: steps.bundle.outputs.enabled == 'true'
        env:
          VERSION: ${{ steps.bundle.outputs.version }}
          OUT: ${{ steps.bundle.outputs.dir }}
          IMAGE_BASE: ghcr.io/${{ github.repository }}
          SYFT: ${{ steps.syft.outputs.cmd }}
          REQUIRE_SBOM: "1"
          CHART: ${{ steps.chart.outputs.file }}
        run: |
          # The images that were smoke-tested above, under the names customers pull them by.
          # The bundle holds the docker package, the native (systemd) package with the jar and
          # web client taken from these same images, and the Helm chart.
          docker tag dsp-api:ci "$IMAGE_BASE-api:$VERSION"
          docker tag dsp-web:ci "$IMAGE_BASE-web:$VERSION"
          scripts/release-bundle.sh --output "$OUT" --chart "$CHART" \
            "$VERSION" "$IMAGE_BASE-api:$VERSION" "$IMAGE_BASE-web:$VERSION"

      - name: Publish the Helm chart
        # Releases only (the images it points at were published above); never from a pull request.
        if: steps.bundle.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART: ${{ steps.chart.outputs.file }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push "$CHART" oci://ghcr.io/winllc/charts 2>&1 | tee "$RUNNER_TEMP/helm-push.log"
          echo "- Helm chart: \`oci://ghcr.io/winllc/charts/directory-services-portal\` $(basename "$CHART" .tgz | sed 's/^directory-services-portal-//')" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up cosign
        if: steps.bundle.outputs.release == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the images and the chart, and attest the images' SBOMs
        # Releases only: keyless (GitHub OIDC), by digest. Verify with
        #   cosign verify ghcr.io/winllc/<image>@<digest> \
        #     --certificate-identity-regexp 'https://github.com/winllc/directory-services-portal/.github/workflows/.*' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
        if: steps.bundle.outputs.release == 'true'
        env:
          VERSION: ${{ steps.bundle.outputs.version }}
          OUT: ${{ steps.bundle.outputs.dir }}
          IMAGE_BASE: ghcr.io/${{ github.repository }}
        run: |
          {
            echo "### Signed (cosign, keyless)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for part in api web; do
            digest="$(docker buildx imagetools inspect "$IMAGE_BASE-$part:$VERSION" --format '{{.Manifest.Digest}}')"
            ref="$IMAGE_BASE-$part@$digest"
            cosign sign --yes "$ref"
            cosign attest --yes --type spdxjson --predicate "$OUT/sbom-directory-services-portal-$part.spdx.json" "$ref"
            echo "- \`$ref\` (signature and SPDX SBOM attestation)" >> "$GITHUB_STEP_SUMMARY"
          done
          chart_digest="$(sed -n 's/^Digest: *//p' "$RUNNER_TEMP/helm-push.log" | head -n1)"
          [ -n "$chart_digest" ] || { echo "No digest in the helm push output"; exit 1; }
          cosign sign --yes "ghcr.io/winllc/charts/directory-services-portal@$chart_digest"
          echo "- \`ghcr.io/winllc/charts/directory-services-portal@$chart_digest\` (signature)" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign the checksums
        id: sign
        if: steps.bundle.outputs.enabled == 'true' && env.HAS_GPG == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          OUT: ${{ steps.bundle.outputs.dir }}
        run: |
          GNUPGHOME="$(mktemp -d)"; export GNUPGHOME
          trap 'gpgconf --kill all; rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          sign=(gpg --batch --yes --pinentry-mode loopback --armor --detach-sign --output "$OUT/SHA256SUMS.asc")
          if [ -n "$GPG_PASSPHRASE" ]; then
            printf '%s' "$GPG_PASSPHRASE" | "${sign[@]}" --passphrase-fd 0 "$OUT/SHA256SUMS"
          else
            "${sign[@]}" "$OUT/SHA256SUMS"
          fi
          gpg --batch --verify "$OUT/SHA256SUMS.asc" "$OUT/SHA256SUMS"

      - name: Keep the bundle as a workflow artifact
        if: steps.bundle.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-directory-services-portal-${{ steps.bundle.outputs.version }}
          path: ${{ steps.bundle.outputs.dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ steps.bundle.outputs.release == 'true' && 30 || 3 }}

      - name: Publish bundle assets to the GitHub Release
        id: github-release
        if: always() && steps.bundle.outputs.release == 'true' && steps.release-bundle.outcome == 'success' && steps.sign.outcome != 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          OUT: ${{ steps.bundle.outputs.dir }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG"
          fi
          gh release upload "$TAG" "$OUT"/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload the bundle to the release bucket
        id: upload
        if: always() && steps.bundle.outputs.release == 'true' && steps.release-bundle.outcome == 'success' && steps.sign.outcome != 'failure' && env.S3_BUCKET != '' && env.HAS_AWS == 'true'
        env:
          VERSION: ${{ steps.bundle.outputs.version }}
          OUT: ${{ steps.bundle.outputs.dir }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.RELEASE_S3_REGION || 'us-east-1' }}
          S3_ENDPOINT: ${{ vars.RELEASE_S3_ENDPOINT }}
        run: |
          aws=(aws); [ -z "$S3_ENDPOINT" ] || aws+=(--endpoint-url "$S3_ENDPOINT")
          dest="s3://$S3_BUCKET/directory-services-portal"
          for f in "$OUT"/*; do
            "${aws[@]}" s3 cp --no-progress "$f" "$dest/$VERSION/$(basename "$f")"
          done
          if [[ "$VERSION" != *-* ]]; then
            printf '%s\n' "$VERSION" > "$RUNNER_TEMP/latest.txt"
            "${aws[@]}" s3 cp --no-progress "$RUNNER_TEMP/latest.txt" "$dest/latest.txt"
          fi

      - name: Summarise the release bundle
        if: always() && steps.bundle.outputs.enabled == 'true'
        env:
          VERSION: ${{ steps.bundle.outputs.version }}
          TAG: ${{ github.ref_name }}
          RELEASE: ${{ steps.bundle.outputs.release }}
          OUT: ${{ steps.bundle.outputs.dir }}
          SIGN_OUTCOME: ${{ steps.sign.outcome }}
          GITHUB_RELEASE_OUTCOME: ${{ steps.github-release.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          {
            echo "### Release bundle directory-services-portal $VERSION"
            echo
            if compgen -G "$OUT/*" > /dev/null; then
              echo "| File | Size |"
              echo "|---|---|"
              for f in "$OUT"/*; do echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"; done
            else
              echo "No bundle was built (see the \"Build the release bundle\" step)."
            fi
            echo
            if [ "$SIGN_OUTCOME" = success ]; then echo "- Signed: yes (\`SHA256SUMS.asc\`)"
            elif [ "$HAS_GPG" != true ]; then echo "- Signed: **no**, the \`RELEASE_GPG_PRIVATE_KEY\` secret is not set"
            else echo "- Signed: **no**, signing $SIGN_OUTCOME"; fi
            if [ "$GITHUB_RELEASE_OUTCOME" = success ]; then echo "- GitHub Release: assets uploaded to \`$TAG\`"
            elif [ "$RELEASE" = true ]; then echo "- GitHub Release: upload $GITHUB_RELEASE_OUTCOME"; fi
            if [ "$UPLOAD_OUTCOME" = success ]; then
              echo "- Uploaded to \`s3://$S3_BUCKET/directory-services-portal/$VERSION/\`"
              if [[ "$VERSION" != *-* ]]; then echo "  and \`latest.txt\` set to $VERSION"; fi
            elif [ "$RELEASE" != true ]; then echo "- Not uploaded: dry run (pull request); kept as the workflow artifact only"
            elif [ -z "$S3_BUCKET" ]; then echo "- Not uploaded: the \`RELEASE_S3_BUCKET\` variable is not set"
            elif [ "$HAS_AWS" != true ]; then echo "- Not uploaded: the \`AWS_ACCESS_KEY_ID\` secret is not set"
            else echo "- Not uploaded: upload $UPLOAD_OUTCOME"; fi
            echo "- Workflow artifact: \`release-directory-services-portal-$VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"
